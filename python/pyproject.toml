[project]
name = "apiverve-thesaurus"
version = "1.2.3"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Thesaurus finds synonyms and alternative terms for any word. Supply a single target word to receive an array of matching synonyms."
keywords = ["thesaurus api", "synonyms api", "synonym api", "free thesaurus api", "word synonyms"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/thesaurus?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/thesaurus?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/thesaurus-api"
Twitter = "https://twitter.com/apivervehq"
